name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Check formatting
        run: test -z "$(find . -path './submodules' -prune -o -name '*.go' -print | xargs gofmt -l)"
      - name: Unit tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Race tests
        run: go test -race ./internal/...
      - name: Shell syntax checks
        run: find tests -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

  a2a-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Verify protocol and SDK pins
        run: tests/conformance/check-pins.sh
      - name: Validate conformance metadata
        run: go test ./tests/conformance

  a2a-tck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - uses: actions/checkout@v4
        with:
          repository: a2aproject/a2a-tck
          ref: 5996b79f9cefa6fc390980e383e358a66fb9e49e
          path: a2a-tck
      - name: Install pinned TCK
        run: uv sync --locked --project a2a-tck
      - name: Run JSON-RPC, HTTP+JSON, and gRPC MUST matrix
        env:
          A2A_TCK_DIR: ${{ github.workspace }}/a2a-tck
          A2A_TCK_PYTHON: ${{ github.workspace }}/a2a-tck/.venv/bin/python
          A2A_TCK_REQUIRE_PIN: '1'
          A2A_TCK_REPORT_ROOT: ${{ github.workspace }}/var/tck
          GO_BIN: go
        run: tests/conformance/run-matrix.sh

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Run partner-style trust integration
        run: tests/trust/run-partner-integration.sh
      - name: Run CloudEvents HTTPS smoke
        run: tests/hub/run-cloudevents-smoke.sh
      - name: Run A2A Push sender and receiver smoke
        run: tests/hub/run-push-smoke.sh
      - name: Run NATS Outbox smoke
        run: tests/eventbus/run-nats-smoke.sh
      - name: Run PostgreSQL backup and restart recovery smokes
        run: |
          tests/postgres/run-backup-restore.sh
          tests/postgres/run-restart-recovery.sh
          tests/postgres/run-encrypted-backup.sh
          tests/postgres/run-ha-failover.sh
          tests/postgres/run-pitr.sh
          tests/minio/run-replication.sh
      - name: Upload conformance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: federation-hub-conformance-reports
          path: var/tck/
          if-no-files-found: ignore

  owned-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Run local preflight and compatibility report
        run: |
          mkdir -p var/reports
          go run ./cmd/hub-preflight --output json | tee var/reports/preflight.json
          go run ./cmd/a2a-compat-report --output json | tee var/reports/a2a-compatibility.json
      - name: Run generality scenario matrix
        run: tests/scenarios/run-matrix.sh
      - name: Upload owned contract reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: federation-hub-owned-contract-reports
          path: var/reports/
          if-no-files-found: ignore
